services:
  - type: web
    name: sms-ai-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # disk: # Persistent disk is only available on paid plans
    #   name: sqlite-data
    #   mountPath: /data
    #   sizeGB: 1

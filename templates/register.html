<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | Message Guardian</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--surface);
            padding: 48px 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 680px;
            background: var(--surface-container-lowest);
            border-radius: var(--radius-xl);
            padding: 56px;
            border: 1px solid var(--outline-variant);
            box-shadow: var(--shadow-ambient);
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; gap: 16px; } }
        .label { display: block; font-size: 0.8rem; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--on-surface-variant); }
    </style>
    </style>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/static/icon-192x192.png">
</head>
<body class="animate-fade-in">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 40px;">
            <div style="width: 72px; height: 72px; background: linear-gradient(135deg, var(--primary), var(--primary-container)); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 24px; color: white; box-shadow: 0 10px 20px rgba(0, 75, 202, 0.2);">
                <i data-lucide="user-plus" style="width: 32px; height: 32px;"></i>
            </div>
            <h1 style="font-size: 2.2rem; margin-bottom: 8px;">Create Account</h1>
            <p style="color: var(--on-surface-variant); font-size: 1.1rem;">Join the secure message platform.</p>
        </div>

        <form method="POST">
            <div class="grid-2">
                <div style="margin-bottom: 24px;">
                    <label class="label">Full Name</label>
                    <input type="text" name="name" class="form-input" placeholder="John Doe" required>
                </div>
                <div style="margin-bottom: 24px;">
                    <label class="label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="john@email.com" required>
                </div>
            </div>

            <div class="grid-2">
                <div style="margin-bottom: 24px;">
                    <label class="label">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-input" placeholder="+91..." required>
                </div>
                <div style="margin-bottom: 24px;">
                    <label class="label">WhatsApp Number</label>
                    <input type="tel" id="whatsapp_number" name="whatsapp_number" class="form-input" placeholder="+91..." required>
                </div>
            </div>

            <div class="grid-2">
                <div style="margin-bottom: 24px;">
                    <label class="label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required minlength="6">
                </div>
                <div style="margin-bottom: 40px;">
                    <label class="label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Create Account <i data-lucide="check"></i>
            </button>
        </form>

        <p style="margin-top: 30px; font-size: 0.9rem; color: var(--text-muted); text-align: center;">
            Already have an account? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
        </p>
    </div>
    <script>lucide.createIcons();</script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister().then(function() { console.log('SW unregistered'); });
                }
            });
        }
    </script>
</body>
</html>
